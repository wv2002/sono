<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sono</title>
<meta name="theme-color" content="#35489A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sono">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face { font-family: 'Figtree'; font-weight: 400; font-style: normal; font-display: swap; src: url('fonts/figtree-latin-400-normal.woff2') format('woff2'); }
@font-face { font-family: 'Figtree'; font-weight: 500; font-style: normal; font-display: swap; src: url('fonts/figtree-latin-500-normal.woff2') format('woff2'); }
@font-face { font-family: 'Figtree'; font-weight: 600; font-style: normal; font-display: swap; src: url('fonts/figtree-latin-600-normal.woff2') format('woff2'); }
@font-face { font-family: 'Bricolage Grotesque'; font-weight: 500; font-style: normal; font-display: swap; src: url('fonts/bricolage-grotesque-latin-500-normal.woff2') format('woff2'); }
@font-face { font-family: 'Bricolage Grotesque'; font-weight: 700; font-style: normal; font-display: swap; src: url('fonts/bricolage-grotesque-latin-700-normal.woff2') format('woff2'); }
/* Layout: app de celular em coluna única, com barra de abas fixa embaixo (Registro, Análises, Metas, Ajustes).
   O registro usa "dias de sono" (das 18h da véspera às 18h) com uma faixa de 24h por dia. */
:root {
  --font-display: 'Bricolage Grotesque', system-ui, sans-serif;
  --font-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --bg: #EDF0F4;
  --surface: #FFFFFF;
  --surface-2: #E3E8F0;
  --fg: #172033;
  --muted: #566277;
  --line: #D2D9E4;
  --accent: #35489A;
  --on-accent: #FFFFFF;
  --night: #3E52AB;
  --nap: #D68A25;
  --awake: #E0675A;
  --danger: #B23B30;
  --scrim: rgba(15, 22, 36, 0.45);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E131B;
    --surface: #161D29;
    --surface-2: #212B3A;
    --fg: #E8EDF5;
    --muted: #97A4B9;
    --line: #2A3445;
    --accent: #8CA2F0;
    --on-accent: #0E131B;
    --night: #8CA2F0;
    --nap: #E7B15F;
    --awake: #F08377;
    --danger: #F29A90;
    --scrim: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E131B;
  --surface: #161D29;
  --surface-2: #212B3A;
  --fg: #E8EDF5;
  --muted: #97A4B9;
  --line: #2A3445;
  --accent: #8CA2F0;
  --on-accent: #0E131B;
  --night: #8CA2F0;
  --nap: #E7B15F;
  --awake: #F08377;
  --danger: #F29A90;
  --scrim: rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; }
body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(20px + env(safe-area-inset-top, 0px)) 96px;
}
.app { max-width: 560px; margin: 0 auto; display: grid; gap: 16px; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, h1, h2 { font-family: var(--font-display); }

.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-top: 4px; }
.top > div { min-width: 0; }
h1 { font-size: 28px; line-height: 1.1; font-weight: 700; letter-spacing: -0.015em; margin: 2px 0 0; text-wrap: balance; }
h2 { font-size: 19px; line-height: 1.2; font-weight: 700; margin: 0; }
.eyebrow { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.lead { margin: 4px 0 0; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; white-space: nowrap; margin-top: 2px; }
.chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
.chip.ok i { background: var(--night); }
.chip.err i { background: var(--awake); }
#view { display: grid; gap: 16px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.card-head p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.empty { margin: 0; color: var(--muted); }
.empty b { color: var(--fg); font-weight: 600; }

/* botões */
.btn { min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; text-align: center; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.sm { min-height: 38px; padding: 0 14px; font-size: 14px; }
.btn.block { width: 100%; }

/* atalho rápido (discreto) */
.quick { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface-2); border-radius: 14px; padding: 10px 10px 10px 16px; }
.quick .q-info { display: grid; min-width: 0; }
.quick b { font-weight: 600; font-size: 14px; }
.quick small { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

/* gráficos */
.chart { display: block; width: 100%; height: auto; }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .goal { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 4 4; }
.chart .ax { fill: var(--muted); font-size: 10.5px; font-family: var(--font-body); }
.chart .ax.now { fill: var(--fg); font-weight: 600; }
.chart .val { fill: var(--fg); font-size: 10.5px; font-weight: 600; font-family: var(--font-body); text-anchor: middle; }
.chart .b-night { fill: var(--night); }
.chart .b-nap { fill: var(--nap); }
.chart .ln-bed { stroke: var(--night); fill: none; stroke-width: 1.6; }
.chart .ln-wake { stroke: var(--nap); fill: none; stroke-width: 1.6; }
.chart .d-bed { fill: var(--night); }
.chart .d-wake { fill: var(--nap); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); margin: 8px 0 0; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.i-night { background: var(--night); } .i-nap { background: var(--nap); } .i-awake { background: var(--awake); }

.ptoggle { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--surface-2); border-radius: 12px; padding: 4px; }
.ptoggle button, .toggle button { min-height: 40px; border: 0; border-radius: 9px; background: none; cursor: pointer; font-weight: 500; color: var(--muted); }
.ptoggle button[aria-pressed="true"], .toggle button[aria-pressed="true"] { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15); }

.kv { display: grid; }
.kv > div { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 11px 0; border-top: 1px solid var(--line); }
.kv > div:first-child { border-top: 0; padding-top: 0; }
.kv dt, .kv .k { color: var(--muted); font-size: 14px; margin: 0; }
.kv dd, .kv .v { margin: 0; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.kv .v small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
dl.kv { margin: 0; }
.kv dd small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }

/* metas */
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; border-top: 1px solid var(--line); }
.setrow:first-of-type { border-top: 0; padding-top: 0; }
.setrow .lbl { display: grid; min-width: 0; }
.setrow .lbl b { font-weight: 600; }
.setrow .lbl small { color: var(--muted); font-size: 13px; }
.stepper { display: inline-flex; align-items: center; gap: 6px; flex: none; }
.stepper b { min-width: 3.6em; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
.stepper button { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 18px; line-height: 1; }
.stepper button:hover { background: var(--surface-2); }
.inp { font: inherit; min-height: 42px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--fg); padding: 0 10px; min-width: 0; }
input.inp[type="time"] { width: 146px; }
input.inp[type="number"] { width: 72px; text-align: center; }
.hint { margin: 0; font-size: 13px; color: var(--muted); }
.note { margin: 12px 0 0; font-size: 13px; color: var(--muted); }

.goalgrid { display: grid; grid-template-columns: 84px repeat(7, minmax(0, 1fr)); gap: 6px; align-items: center; }
.goalgrid .gl-lab { display: grid; line-height: 1.2; }
.goalgrid .gl-lab b { font-weight: 600; font-size: 14px; }
.goalgrid .gl-lab small { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.goalgrid .cell { height: 28px; border-radius: 7px; background: var(--surface-2); }
.goalgrid .cell.hit { background: var(--night); }
.goalgrid .cell.miss { background: transparent; border: 2px solid var(--awake); }
.goalgrid .wdl { font-size: 11px; color: var(--muted); text-align: center; }

/* histórico */
.day { padding: 16px 0; border-top: 1px solid var(--line); }
.day:first-of-type { border-top: 0; padding-top: 4px; }
.day-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.day-head h3 { margin: 0; font-size: 16px; font-weight: 600; }
.day-total { font-family: var(--font-display); font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.unit { font-family: var(--font-body); font-size: 0.6em; font-weight: 500; color: var(--muted); margin-left: 2px; }
.day-sum { margin: 2px 0 10px; font-size: 13px; color: var(--muted); }
.band { position: relative; height: 22px; border-radius: 7px; background: var(--surface-2); overflow: hidden; }
.band .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
.band .seg { position: absolute; top: 3px; bottom: 3px; border-radius: 4px; min-width: 3px; }
.seg.noite { background: var(--night); }
.seg.soneca { background: var(--nap); }
.seg.gap { background: var(--awake); top: 7px; bottom: 7px; border-radius: 2px; }
.band-labels { position: relative; height: 16px; font-size: 11px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
.band-labels span { position: absolute; transform: translateX(-50%); }
.band-labels span:first-child { transform: none; }
.band-labels span:last-child { transform: translateX(-100%); }
.rows { display: grid; margin-top: 6px; }
.row { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; width: 100%; min-height: 48px; padding: 6px 4px; border: 0; background: none; cursor: pointer; border-radius: 10px; }
.row:hover { background: var(--surface-2); }
.row .dot { width: 10px; height: 10px; border-radius: 3px; }
.row .main { display: grid; min-width: 0; }
.row .main b { font-weight: 600; font-variant-numeric: tabular-nums; }
.row .main small { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.row .side { font-size: 12px; color: var(--muted); white-space: nowrap; }
.gaprow { display: flex; align-items: center; gap: 12px; padding: 0 4px; min-height: 30px; font-size: 13px; color: var(--danger); font-variant-numeric: tabular-nums; }
.gaprow i { width: 10px; height: 2px; background: var(--awake); border-radius: 2px; display: inline-block; flex: none; }
.more { display: flex; justify-content: center; margin-top: 8px; }

/* ajustes */
.actions-col { display: grid; gap: 8px; }
.file-btn input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.file-btn { position: relative; }

/* barra de abas */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--surface); border-top: 1px solid var(--line);
  padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabbar-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 54px; border: 0; background: none; color: var(--muted); font-size: 11.5px; font-weight: 600; cursor: pointer; border-radius: 12px; }
.tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--accent); background: var(--surface-2); }

/* folha de edição */
.sheet { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet-backdrop { position: absolute; inset: 0; background: var(--scrim); }
.sheet-panel { position: relative; width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; background: var(--surface); border-radius: 20px 20px 0 0; border: 1px solid var(--line); border-bottom: 0;
  padding-top: 20px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.field { display: grid; gap: 6px; min-width: 0; border: 0; padding: 0; margin: 0; }
.field > label, .field > legend { font-size: 13px; font-weight: 600; color: var(--muted); padding: 0; }
.field input[type="datetime-local"], .field input[type="text"] { font: inherit; min-height: 46px; width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--fg); padding: 0 12px; }
.toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--surface-2); border-radius: 12px; padding: 4px; }
.quality { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.quality button { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; }
.quality button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.err { margin: 0; color: var(--danger); font-size: 14px; }
.err:empty { display: none; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.actions .primary { grid-column: 1 / -1; min-height: 50px; }
.actions .danger { grid-column: 1 / -1; }

.toast { position: fixed; left: 0; right: 0; bottom: calc(82px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; z-index: 60; pointer-events: none; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.toast span { background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25); }

.field-col { display: grid; gap: 6px; margin-bottom: 12px; }
.field-col label { font-size: 13px; font-weight: 600; color: var(--muted); }
.inp.wide { width: 100%; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <p class="eyebrow">Sono</p>
      <h1 id="viewTitle">Registro</h1>
    </div>
    <span class="chip" id="syncChip"><i></i><span id="syncText">Conectando…</span></span>
  </header>
  <main id="view" aria-live="polite"></main>
</div>

<nav class="tabbar" aria-label="Seções">
  <div class="tabbar-in">
    <button type="button" class="tab" data-tab="registro"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="2.5"/><path d="M9 8.5h6M9 12h6M9 15.5h3.5"/></svg>Registro</button>
    <button type="button" class="tab" data-tab="analises"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-7"/></svg>Análises</button>
    <button type="button" class="tab" data-tab="metas"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="0.8" fill="currentColor"/></svg>Metas</button>
    <button type="button" class="tab" data-tab="ajustes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Ajustes</button>
  </div>
</nav>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-backdrop" data-act="close"></div>
  <form class="sheet-panel" id="sheetForm" novalidate>
    <h2 id="sheetTitle">Novo registro</h2>
    <div class="toggle" role="group" aria-label="Tipo de sono">
      <button type="button" data-kind="noite" aria-pressed="true">Noite</button>
      <button type="button" data-kind="soneca" aria-pressed="false">Soneca</button>
    </div>
    <div class="field">
      <label for="fStart">Fui dormir</label>
      <input id="fStart" type="datetime-local">
    </div>
    <div class="field">
      <label for="fEnd">Acordei</label>
      <input id="fEnd" type="datetime-local">
      <p class="hint" id="endHint" hidden>Deixe vazio se ainda está dormindo.</p>
    </div>
    <fieldset class="field">
      <legend>Como dormiu? (opcional)</legend>
      <div class="quality" id="quality">
        <button type="button" data-q="1" aria-pressed="false">1</button>
        <button type="button" data-q="2" aria-pressed="false">2</button>
        <button type="button" data-q="3" aria-pressed="false">3</button>
        <button type="button" data-q="4" aria-pressed="false">4</button>
        <button type="button" data-q="5" aria-pressed="false">5</button>
      </div>
      <p class="hint">1 = péssimo, 5 = ótimo</p>
    </fieldset>
    <div class="field">
      <label for="fNote">Anotação (opcional)</label>
      <input id="fNote" type="text" maxlength="200" placeholder="Ex.: acordei com calor, barulho na rua">
    </div>
    <p class="err" id="fErr" role="alert"></p>
    <div class="actions">
      <button type="submit" class="btn primary">Salvar</button>
      <button type="button" class="btn" data-act="close">Cancelar</button>
      <button type="button" class="btn danger" id="fDel" hidden>Excluir registro</button>
    </div>
  </form>
</div>

<div class="toast" id="toast" aria-live="polite"></div>

<script src="xlsx.mini.min.js"></script>
<script>
(function () {
'use strict';

//#LOGIC-START
var MIN = 60000, HOUR = 3600000, DAY = 86400000;
var DEF = { goalH: 8, bed: 1380, wake: 420, tol: 30, napFrom: 6, napTo: 19, gapMaxH: 4 };
function pad(n) { return String(n).padStart(2, '0'); }
function dayKey(ms) { var d = new Date(ms); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function addDays(key, n) { var p = key.split('-').map(Number); return dayKey(new Date(p[0], p[1] - 1, p[2] + n, 12).getTime()); }
function windowStart(key) { var p = key.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2] - 1, 18).getTime(); }
function fmtTime(ms) { var d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function fmtDur(ms) {
  var m = Math.max(0, Math.round(ms / MIN)), h = Math.floor(m / 60), mm = m % 60;
  if (h === 0) return mm + 'min';
  if (mm === 0) return h + 'h';
  return h + 'h ' + pad(mm) + 'min';
}
function fmtShort(ms) {
  var m = Math.max(0, Math.round(ms / MIN)), h = Math.floor(m / 60), mm = m % 60;
  return mm === 0 ? h + 'h' : h + 'h' + pad(mm);
}
function fmtMin(m) { m = Math.round(((m % 1440) + 1440) % 1440); return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
function minutesOfDay(ms) { var d = new Date(ms); return d.getHours() * 60 + d.getMinutes(); }
function autoKind(ms, cfg) { var h = new Date(ms).getHours(); return (h >= cfg.napFrom && h < cfg.napTo) ? 'soneca' : 'noite'; }
function circDiff(a, b) { return ((((a - b + 720) % 1440) + 1440) % 1440) - 720; }
function bedAxis(ms) { var m = minutesOfDay(ms); return m < 720 ? m + 1440 : m; }

  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})[ T](\d{1,2}):(\d{2})/);
  if (m) return new Date(+m[3], +m[2] - 1, +m[1], +m[4], +m[5]).getTime();
  return null;
}
function importXlsx(file) {
  if (!file) return;
  if (typeof XLSX === 'undefined') { toast('Leitor de Excel indisponível agora.'); return; }
  var fr = new FileReader();
  fr.onerror = function () { toast('Não consegui ler esse arquivo.'); };
  fr.onload = function () {
    try {
      var wb = XLSX.read(fr.result, { type: 'array' });
      var ws = wb.Sheets['Registros'] || wb.Sheets[wb.SheetNames[0]];
      var rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
      var head = (rows[0] || []).map(norm);
      var iS = head.indexOf('dormiu'), iE = head.indexOf('acordou'), iK = head.indexOf('tipo'), iQ = head.findIndex(function (x) { return x.indexOf('nota') === 0; }), iN = head.indexOf('anotacao');
      if (iS < 0 || iE < 0) { toast('Não achei as colunas Dormiu e Acordou na primeira aba.'); return; }
      var seen = {};
      sessions.forEach(function (s) { seen[s.start + '_' + s.end] = true; });
      var add = [], dup = 0, bad = 0;
      rows.slice(1).forEach(function (r) {
        if (r.every(function (c) { return c === ''; })) return;
        var st = cellToMs(r[iS]), en = cellToMs(r[iE]);
        if (st == null || (en != null && (en <= st || en - st > DAY))) { bad++; return; }
        var key = st + '_' + en;
        if (seen[key]) { dup++; return; }
        seen[key] = true;
        var q = iQ >= 0 ? Math.round(Number(r[iQ]) || 0) : 0;
        add.push({ id: newId(), start: st, end: en, kind: iK >= 0 && norm(r[iK]) === 'soneca' ? 'soneca' : 'noite', note: iN >= 0 ? String(r[iN] || '').slice(0, 200) : '', quality: q >= 1 && q <= 5 ? q : 0 });
      });
      if (add.length) addMany(add);
      toast(add.length ? add.length + ' registros importados' + (dup ? ', ' + dup + ' já existiam' : '') + (bad ? ', ' + bad + ' ignorados' : '') : (dup ? 'Todos os registros já existiam' : 'Nenhum registro válido encontrado'));
    } catch (e) { toast('Não consegui abrir essa planilha.'); }
  };
  fr.readAsArrayBuffer(file);
}

/* ---------- eventos ---------- */
function parseTime(v) { var m = /^(\d{1,2}):(\d{2})/.exec(v || ''); return m ? (+m[1]) * 60 + (+m[2]) : null; }
document.addEventListener('click', function (ev) {
  var sk = ev.target.closest('#sheet .toggle button');
  if (sk) { kindTouched = true; setKind(sk.getAttribute('data-kind')); return; }
  var qb = ev.target.closest('#quality button');
  if (qb) { var q = Number(qb.getAttribute('data-q')); setQ(curQ === q ? 0 : q); return; }
  var tab = ev.target.closest('[data-tab]');
  if (tab) { go(tab.getAttribute('data-tab')); return; }
  var pb = ev.target.closest('[data-period]');
  if (pb) { period = Number(pb.getAttribute('data-period')); render(); return; }
  var t = ev.target.closest('[data-act]');
  if (!t) return;
  var act = t.getAttribute('data-act');
  if (act === 'start') startNow();
  else if (act === 'wake') wakeNow();
  else if (act === 'manual') openSheet(null);
  else if (act === 'edit') openSheet(t.getAttribute('data-id'));
  else if (act === 'close') closeSheet();
  else if (act === 'more') { shown += 10; render(); }
  else if (act === 'goal-') { cfg.goalH = Math.max(4, cfg.goalH - 0.5); saveCfg(); }
  else if (act === 'goal+') { cfg.goalH = Math.min(12, cfg.goalH + 0.5); saveCfg(); }
  else if (act === 'tol-') { cfg.tol = Math.max(5, cfg.tol - 5); saveCfg(); }
  else if (act === 'tol+') { cfg.tol = Math.min(120, cfg.tol + 5); saveCfg(); }
  else if (act === 'export') exportXlsx();
  else if (act === 'sync-save') saveSyncConf();
  else if (act === 'sync-now') doSync(true);
  else if (act === 'wipe') {
    if (!wipeArmed) { wipeArmed = true; render(); return; }
    wipeArmed = false; wipeAll(); toast('Registros apagados');
  }
});
document.addEventListener('change', function (ev) {
  var t = ev.target, id = t.id;
  if (id === 'goalBed') { var b = parseTime(t.value); if (b != null) { cfg.bed = b; saveCfg(); } }
  else if (id === 'goalWake') { var w = parseTime(t.value); if (w != null) { cfg.wake = w; saveCfg(); } }
  else if (id === 'napFrom' || id === 'napTo' || id === 'gapMax') {
    var c = Object.assign({}, cfg);
    if (id === 'napFrom') c.napFrom = t.value; else if (id === 'napTo') c.napTo = t.value; else c.gapMaxH = t.value;
    cfg = sanitizeCfg(c);
    if (cfg.napTo <= cfg.napFrom) { cfg.napTo = Math.min(24, cfg.napFrom + 1); }
    saveCfg();
  }
  else if (id === 'importFile') { importXlsx(t.files && t.files[0]); t.value = ''; }
  else if (id === 'fStart') {
    if (kindTouched) return;
    var ms = new Date(t.value).getTime();
    if (isFinite(ms)) setKind(autoKind(ms, cfg));
  }
});
$('#sheetForm').addEventListener('submit', submitSheet);
$('#fDel').addEventListener('click', deleteFromSheet);
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
window.addEventListener('hashchange', function () {
  var h = (location.hash || '').replace('#', '');
  if (TABS.indexOf(h) >= 0 && h !== current) { current = h; wipeArmed = false; render(); window.scrollTo(0, 0); }
});

/* ---------- início ---------- */
function loadAll() {
  loadCfg();
  sessions = readKey(LOCAL);
  try { var q = JSON.parse(localStorage.getItem(QKEY) || 'null'); if (q && q.up && q.del) queue = { up: q.up, del: q.del, cfg: q.cfg || 0 }; } catch (e) {}
  try { var sc = JSON.parse(localStorage.getItem(SKEY) || 'null'); if (sc) syncConf = { url: String(sc.url || ''), token: String(sc.token || ''), last: Number(sc.last) || 0 }; } catch (e) {}
}
loadAll();
(function () { var h = (location.hash || '').replace('#', ''); if (TABS.indexOf(h) >= 0) current = h; })();
render();
setInterval(tick, 30000);
window.addEventListener('online', function () { render(true); doSync(false); });
window.addEventListener('offline', function () { render(true); });
document.addEventListener('visibilitychange', function () { if (!document.hidden) { render(true); doSync(false); } });
if (syncConf.url) doSync(false);
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
})();
</script>
